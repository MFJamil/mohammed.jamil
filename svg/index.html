 <!DOCTYPE html>
 <html>
 <head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>SVG Example</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    
 </head>
 <body>
    <svg class="svg">
      <clipPath id="my-clip-path" clipPathUnits="objectBoundingBox"><path d="M0,0 H1 V0.85 H0.9 v0.15 L0.75,0.85 L0.1,0.85 Q 0,0.85,0,0.75"></path></clipPath>
   </svg>
   <div style="display: flex;flex-direction: column;justify-content: center;align-items: center; width: 100%;height: 100%;">
      <span class="tag-wrap">
         <div class="clipped">
            <img src="./Berlin_1.jpg" style="width: 100%;height: 100%; object-fit: cover;box-shadow: 4px red;" />
         </div>
      </span>
   </div>
 </body>
 </html>
